name: CI + Deploy to VPS via SSH

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run basic test
        run: python -c "print('CI CHECK OK - Python & Flask installed')"

      - name: Simulating Google Cloud Build
        run: |
          echo "Simulating Google Cloud Build using cloudbuild.yaml"
          docker build -t flask-app .
          docker images

      - name: Upload project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "./"
          target: "/home/${{ secrets.VPS_USER }}/flask-app"

      - name: Run Flask App on VPS using PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: false
          script: |
            cd flask-app

            # Instalar PM2 si no está instalado
            if ! command -v pm2 &> /dev/null
            then
                echo "PM2 not found, installing..."
                sudo apt update -y
                sudo apt install -y nodejs npm
                sudo npm install -g pm2
            fi

            # Eliminar cualquier proceso anterior
            pm2 delete flask || true

            # Iniciar Flask con PM2
            pm2 start main.py --name flask --interpreter python3

            # Guardar configuración de PM2 (para que sobreviva reinicios)
            pm2 save

            # Iniciar PM2 en el arranque del servidor
            pm2 startup systemd -u ${{ secrets.VPS_USER }} --hp /home/${{ secrets.VPS_USER }}

            echo "Flask app running on VPS successfully with PM2!"
